[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"


[lib]
path = "src/lib.rs"

[[bin]]
name = "zero2prod"
path = "src/main.rs"

[dependencies]
actix-web = "4.13.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros","uuid","chrono","migrate"] }
config = "0.15.19"
chrono = "0.4.44"
uuid = "1.21.0"
[dev-dependencies]
reqwest = "0.13.2" 
